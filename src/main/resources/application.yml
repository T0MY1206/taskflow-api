spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_db?options=-c%20TimeZone%3DUTC
    username: demo_user
    password: demo_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

# JWT
app:
  jwt:
    secret: my-secret-key-at-least-256-bits-for-hs256-algorithm-please-change-in-production
    expiration-ms: 86400000  # 24 horas

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
