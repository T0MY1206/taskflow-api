spring:
  application:
    name: demo
  # Perfil por defecto si no se define SPRING_PROFILES_ACTIVE ni --spring.profiles.active
  profiles:
    active: dev
  # Virtual threads (Java 21+) para mayor concurrencia sin aumentar hilos de plataforma
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_db?options=-c%20TimeZone%3DUTC
    username: demo_user
    password: demo_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

# JWT
app:
  jwt:
    secret: my-secret-key-at-least-256-bits-for-hs256-algorithm-please-change-in-production
    expiration-ms: 86400000  # 24 horas

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator: health e info públicos (load balancers); el resto requiere JWT
management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # detalles solo si hay auth; sin auth solo status
    info:
      enabled: true
  info:
    env:
      enabled: true
